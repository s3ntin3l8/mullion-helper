name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag whose installers should be built
        required: false
        type: string

jobs:
  release-please:
    if: ${{ github.event_name == 'push' || inputs.release_tag == '' }}
    permissions:
      contents: write
      pull-requests: write
    uses: s3ntin3l8/.github/.github/workflows/release-please.yml@main

  resolve-release:
    needs: release-please
    if: ${{ always() && (needs.release-please.result == 'success' || inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_release: ${{ steps.release.outputs.has_release }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ -z "$tag" ]]; then
            releases="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isDraft)"
            while IFS= read -r candidate; do
              if jq -e --arg tag "$candidate" \
                'any(.[]; .tagName == $tag and .isDraft == false)' <<< "$releases" >/dev/null; then
                tag="$candidate"
              fi
            done < <(git tag --points-at "$GITHUB_SHA" | sort -V)
          fi
          if [[ -z "$tag" ]]; then
            echo "::notice::No published release points at $GITHUB_SHA; installer build skipped."
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! is_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"; then
            echo "Release $tag does not exist or could not be read" >&2
            exit 1
          fi
          if [[ "$is_draft" != "false" ]]; then
            echo "Release $tag is not published" >&2
            exit 1
          fi
          if [[ -n "$REQUESTED_TAG" ]] && ! git merge-base --is-ancestor "$tag^{commit}" origin/main; then
            echo "Release $tag does not point into main" >&2
            exit 1
          fi
          echo "has_release=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"

  build-installers:
    name: Build ${{ matrix.label }} installer
    needs: resolve-release
    if: ${{ needs.resolve-release.outputs.has_release == 'true' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-14
            label: macOS Apple Silicon DMG
            bundles: dmg
          - os: windows-latest
            label: Windows x64 NSIS
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.os }}
      - run: npm ci
      - run: npm run stage:sidecar
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.resolve-release.outputs.tag_name }}
          args: --bundles ${{ matrix.bundles }}
          updaterJsonPreferNsis: true
